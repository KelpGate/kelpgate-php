name: Auto tag

# When a change that bumps the version lands on main, create the matching v<version> tag and start the
# publish workflow for it. A tag pushed with the built-in token does not start other workflows by itself,
# so this workflow starts release.yml explicitly. If the tag already exists (you pushed it by hand), nothing happens.
on:
  push:
    branches: [main]
    paths:
      - src/KelpgateClient.php
      - CHANGELOG.md

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write  # start the publish workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version
        id: v
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*const VERSION = '\([0-9][^']*\)'.*/\1/p" src/KelpgateClient.php | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::notice::No release version found ($version); nothing to tag."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag and start the publish workflow
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists; nothing to do."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
